<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="View and explore 3D GLB models in your browser.">
  <title>Alton 3D Model Viewer</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; overflow: hidden; color: #eef7ff; background: #07111f; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .hud { position: fixed; z-index: 2; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: clamp(18px, 4vw, 42px); pointer-events: none; }
    header { max-width: 560px; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 48px); line-height: 1; letter-spacing: -.04em; text-shadow: 0 4px 12px #0008; }
    p { margin: 0; color: #a9bfd3; font-size: 14px; text-shadow: 0 2px 4px #0008; }
    .bottom { display: grid; gap: 12px; justify-items: start; pointer-events: auto; }
    .model-picker, .motion-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; }
    button { border: 1px solid #42627c; border-radius: 999px; background: #10243a; color: #eef7ff; padding: 10px 16px; font: inherit; font-weight: 650; cursor: pointer; transition: .18s ease; }
    button:hover:not(:disabled) { transform: translateY(-2px); background: #1a3855; }
    button[aria-pressed="true"], button.primary { border-color: #7de6ff; background: #55cbe8; color: #062032; }
    button:disabled { opacity: .48; cursor: not-allowed; }
    #status { max-width: min(680px, calc(100vw - 40px)); color: #b8cce0; font-size: 13px; }
    #status.error { color: #ff9a9a; }
    .vignette { position: fixed; z-index: 1; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 40%, #030912a8 100%); }
    @media (max-width: 520px) { .hud { padding: 20px; } .bottom { gap: 9px; } button { padding: 9px 13px; } }
  </style>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div class="hud">
    <header>
      <h1>Alton 3D Viewer</h1>
      <p>Choose a model to view. Drag to orbit, right-click to pan, and scroll to zoom.</p>
    </header>
    <section class="bottom" aria-label="Viewer controls">
      <div class="model-picker" aria-label="Choose a model">
        <button id="dragonButton" type="button" aria-pressed="true">🐉 Dragon</button>
        <button id="swordButton" type="button" aria-pressed="false">⚔️ Sword <span id="swordBadge">(placeholder)</span></button>
      </div>
      <div class="motion-controls" id="motionControls">
        <button id="flyButton" class="primary" type="button">✦ Fly</button>
        <button id="dashButton" type="button">➜ Dash</button>
      </div>
      <p id="status" role="status" aria-live="polite">Loading dragon.glb…</p>
    </section>
  </div>
  <div class="vignette"></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const ASSETS = {
      dragon: 'https://cdn.jsdelivr.net/gh/altonsuper/alton3d@model/dragon.glb',
      // Upload sword.glb to the root of the model branch to enable this option.
      sword: 'https://cdn.jsdelivr.net/gh/altonsuper/alton3d@model/sword.glb'
    };
    const status = document.querySelector('#status');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#09182a');
    scene.fog = new THREE.FogExp2('#09182a', 0.025);

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 1.4, 7.5);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.prepend(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xb9e8ff, 0x182137, 1.8));
    const keyLight = new THREE.DirectionalLight(0xffe4bd, 2.8);
    keyLight.position.set(-4, 6, 5);
    scene.add(keyLight);
    const rimLight = new THREE.PointLight(0x36bdf2, 24, 18);
    rimLight.position.set(5, 2, -4);
    scene.add(rimLight);

    const starsGeometry = new THREE.BufferGeometry();
    const starPositions = [];
    for (let i = 0; i < 700; i++) {
      starPositions.push((Math.random() - 0.5) * 40, (Math.random() - 0.5) * 30, -5 - Math.random() * 30);
    }
    starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
    const stars = new THREE.Points(starsGeometry, new THREE.PointsMaterial({ color: 0xa9dfff, size: 0.04, transparent: true, opacity: 0.8 }));
    scene.add(stars);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0.4, 0);

    const loader = new GLTFLoader();
    const modelRoot = new THREE.Group();
    scene.add(modelRoot);
    let mixer = null;
    let selectedModel = 'dragon';
    let requestId = 0;
    let flying = true;
    let dashStarted = -Infinity;
    const clock = new THREE.Clock();
    const dragonButton = document.querySelector('#dragonButton');
    const swordButton = document.querySelector('#swordButton');
    const flyButton = document.querySelector('#flyButton');
    const motionControls = document.querySelector('#motionControls');

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle('error', isError);
    }

    function selectModel(name) {
      selectedModel = name;
      const thisRequest = ++requestId;
      dragonButton.setAttribute('aria-pressed', String(name === 'dragon'));
      swordButton.setAttribute('aria-pressed', String(name === 'sword'));
      motionControls.hidden = name !== 'dragon';
      modelRoot.clear();
      mixer = null;
      setStatus(`Loading ${name}.glb…`);

      loader.load(ASSETS[name], (gltf) => {
        if (thisRequest !== requestId) return;
        const model = gltf.scene;
        const bounds = new THREE.Box3().setFromObject(model);
        const size = bounds.getSize(new THREE.Vector3());
        const center = bounds.getCenter(new THREE.Vector3());
        const maxDimension = Math.max(size.x, size.y, size.z) || 1;
        const scale = 3.8 / maxDimension;
        model.scale.setScalar(scale);
        model.position.sub(center.multiplyScalar(scale));
        modelRoot.add(model);
        if (gltf.animations.length) {
          mixer = new THREE.AnimationMixer(model);
          gltf.animations.forEach((clip) => mixer.clipAction(clip).play());
        }
        controls.target.set(0, 0, 0);
        setStatus(`${name === 'dragon' ? 'Dragon' : 'Sword'} loaded — drag to rotate, scroll to zoom.`);
      }, (event) => {
        if (thisRequest === requestId && event.total) {
          setStatus(`Loading ${name}.glb… ${Math.round(event.loaded / event.total * 100)}%`);
        }
      }, (error) => {
        if (thisRequest !== requestId) return;
        console.error(`Could not load ${name} model from ${ASSETS[name]}`, error);
        if (name === 'sword') {
          setStatus('Sword placeholder: upload sword.glb to the model branch root, then refresh.', true);
        } else {
          setStatus('Dragon failed to load. Check the browser console and CDN URL.', true);
        }
      });
    }

    dragonButton.addEventListener('click', () => selectModel('dragon'));
    swordButton.addEventListener('click', () => selectModel('sword'));
    document.querySelector('#dashButton').addEventListener('click', () => { dashStarted = clock.elapsedTime; });
    flyButton.addEventListener('click', () => {
      flying = !flying;
      flyButton.textContent = flying ? '✦ Fly' : 'Ⅱ Pause';
      flyButton.classList.toggle('primary', flying);
    });
    addEventListener('keydown', (event) => {
      if (event.code === 'Space' && selectedModel === 'dragon') {
        event.preventDefault();
        flying = !flying;
        flyButton.textContent = flying ? '✦ Fly' : 'Ⅱ Pause';
        flyButton.classList.toggle('primary', flying);
      }
      if ((event.code === 'ShiftLeft' || event.code === 'ShiftRight') && selectedModel === 'dragon') dashStarted = clock.elapsedTime;
    });

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.elapsedTime;
      if (mixer) mixer.update(delta);
      if (selectedModel === 'dragon') {
        const bob = flying ? Math.sin(elapsed * 2.2) * 0.18 : 0;
        const dashAge = elapsed - dashStarted;
        const dash = dashAge >= 0 && dashAge < 0.65 ? Math.sin(Math.PI * dashAge / 0.65) : 0;
        modelRoot.position.set(Math.sin(elapsed * 0.55) * 0.4 + dash * 0.9, bob + dash * 0.08, 0);
        modelRoot.rotation.z = flying ? Math.sin(elapsed * 2.2) * 0.04 - dash * 0.1 : 0;
        modelRoot.rotation.y = Math.sin(elapsed * 0.45) * 0.1 - dash * 0.14;
      } else {
        modelRoot.position.set(0, Math.sin(elapsed * 1.2) * 0.06, 0);
        modelRoot.rotation.y = elapsed * 0.18;
      }
      stars.rotation.y = elapsed * 0.005;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });
    selectModel('dragon');
  </script>
</body>
</html>
